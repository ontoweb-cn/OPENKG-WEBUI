name: PyPI Release

# Triggered when a GitHub Release is published.
# Publishes the full app package with the version derived from the release tag:
#   - openkg-webui (Python backend/CLI + packaged Next.js standalone assets)
#
# The CLI-only package (openkg-webui-cli, defined at packaging/openkg-webui-cli)
# is intentionally NOT published here: it is the same source tree with a
# narrower dependency set, and both distributions read the version from
# openkg_webui/__version__.py, so publishing two artifacts from one tag would
# need a second PyPI project configured for trusted publishing. Install it from
# a checkout with `python -m pip install -e ./packaging/openkg-webui-cli`.
#
# Expected tag format: vMAJOR.MINOR.PATCH, with PEP 440-compatible suffixes allowed.
# Example: GitHub release tag v1.3.10 -> PyPI version 1.3.10.
#
# PyPI authentication uses Trusted Publishing. Configure the `openkg-webui`
# PyPI project to trust this workflow file, then no API token secret is needed.
#
# NOTE: this repository's `origin` is currently Gitee, where GitHub Actions do
# not run. The file is kept as the authoritative release procedure and for the
# pinned contract tests (tests/test_release_workflow_guards.py); a Gitee Go
# pipeline replicating it must reimplement the same tag validation.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      # Pinned by tests/test_release_workflow_guards.py and executed as a
      # standalone Python program: keep it free of shell and step dependencies.
      - name: Require a package version tag
        shell: python
        run: |
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          pattern = (
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:(?:a|b|rc)(?:0|[1-9]\d*))?"
              r"(?:\.post(?:0|[1-9]\d*))?"
              r"(?:\.dev(?:0|[1-9]\d*))?"
              r"(?:\+[0-9A-Za-z]+(?:[._-][0-9A-Za-z]+)*)?$"
          )
          if not re.fullmatch(pattern, tag):
              raise SystemExit(
                  f"Release tag {tag!r} is not a package version tag "
                  "(expected vX.Y.Z with an optional suffix)."
              )
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  build-and-publish:
    name: Build and Publish PyPI Package
    needs: validate-release-tag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openkg-webui/

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag="${{ github.event.release.tag_name }}"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $tag ($tag_commit) is not on origin/main; refusing to publish to PyPI." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build packaging twine

      - name: Verify release tag matches openkg_webui/__version__.py
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          tag_raw = tag[1:] if tag.startswith("v") else tag
          tag_version = str(Version(tag_raw))

          src = Path("openkg_webui/__version__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.MULTILINE)
          if not match:
              raise SystemExit(
                  "Could not find __version__ in openkg_webui/__version__.py"
              )
          code_version = str(Version(match.group(1)))

          if code_version != tag_version:
              raise SystemExit(
                  f"Release tag {tag!r} (normalized {tag_version!r}) does not "
                  f"match openkg_webui/__version__.py value {code_version!r}. "
                  "Bump __version__ before tagging."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={code_version}\n")
          PY
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      # Produces the `openkg_webui_web` package data (Next.js standalone output),
      # which the wheel ships so `openkg-webui start` can serve the UI offline.
      - name: Build packaged Web assets
        run: python scripts/prepare_web_package.py

      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/openkg-webui
          # Run from /tmp so any repository-local build/ directory cannot shadow
          # PyPA's `build` module during repeated package builds.
          # Wheels are the supported public install artifacts. The full app wheel
          # contains packaged Next.js assets; source distributions would either
          # duplicate those large assets or require a frontend build.
          (cd /tmp && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist/openkg-webui" "$GITHUB_WORKSPACE")

      - name: Verify package metadata
        run: |
          python -m twine check dist/openkg-webui/*
          python - <<'PY'
          from pathlib import Path
          expected = "${{ steps.version.outputs.version }}"
          files = {
              "openkg-webui": sorted(path.name for path in Path("dist/openkg-webui").glob("*")),
          }
          for package, names in files.items():
              print(package)
              print("\n".join(f"  {name}" for name in names))
          required = [
              ("openkg-webui", f"openkg_webui-{expected}-py3-none-any.whl"),
          ]
          missing = [name for package, name in required if name not in files[package]]
          if missing:
              raise SystemExit(f"Missing expected distributions: {missing}")
          PY

      - name: Publish openkg-webui to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/openkg-webui/
          print-hash: true
